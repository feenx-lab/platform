---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumBGPPeeringPolicy
metadata:
 name: cab-opnsense
 namespace: cilium
spec:
 nodeSelector:
   matchLabels:
    kubernetes.io/os: linux
 virtualRouters:
 - localASN: 64750
   exportPodCIDR: false # https://docs.cilium.io/en/latest/network/bgp-control-plane/#advertising-podcidrs
   serviceSelector: # https://docs.cilium.io/en/stable/network/bgp-control-plane/#service-announcements
      matchExpressions:
        - {key: io.cilium/announce, operator: NotIn, values: ['dummy-value']}
   serviceAdvertisements:
      - LoadBalancerIP
   neighbors:
    - peerAddress: '10.7.0.1/32'
      peerASN: 64700
      gracefulRestart:
          enabled: true
          restartTimeSeconds: 60
      families: # https://docs.cilium.io/en/latest/network/bgp-control-plane/#address-families
      - afi: ipv4 # disable ipv6 advertisement to work around https://github.com/cilium/cilium/issues/30367/
        safi: unicast
      # defaults (for argocd sync diff) https://docs.cilium.io/en/stable/network/bgp-control-plane/#fields
      peerPort: 179
      eBGPMultihopTTL: 1 # 1 = eBGP multihop disabled
      connectRetryTimeSeconds: 120
      holdTimeSeconds: 90
      keepAliveTimeSeconds: 30
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: cab-talos
  namespace: kube-system
spec:
  blocks:
    - cidr: "10.7.5.0/24"