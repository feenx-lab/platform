apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./bgp-ipam.yaml

helmCharts:
- name: cilium # https://docs.cilium.io/en/v1.13/gettingstarted/k8s-install-helm/
  repo: https://helm.cilium.io
  releaseName: cilium
  version: 1.17.6 # https://helm.cilium.io/ (click source)
  valuesFile: cilium-values.yaml
  includeCRDs: true
  namespace: cilium # without this, hubble looks for services in default namespace