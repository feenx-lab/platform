apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ds.yaml
  - networks.yaml
patches:
  - patch: |
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: host-run-netns
            hostPath:
              path: /var/run/netns/
    target:
      kind: DaemonSet
      name: kube-multus-ds
      namespace: kube-system