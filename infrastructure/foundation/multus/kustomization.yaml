apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ds.yaml
  - networks.yaml
patches:
  - patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-multus-ds
        namespace: kube-system
      spec:
        template:
          spec:
            initContainers:
            - command:
              - /install-cni.sh
              image: ghcr.io/siderolabs/install-cni:latest
              name: install-cni
              securityContext:
                privileged: true
              volumeMounts:
              - mountPath: /host/opt/cni/bin
                mountPropagation: Bidirectional
                name: cnibin
            volumes:
              - name: host-run-netns
                hostPath:
                  path: /var/run/netns/
    target:
      kind: DaemonSet
      name: kube-multus-ds
      namespace: kube-system