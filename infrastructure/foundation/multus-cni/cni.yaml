# talos ships with nothing in /opt/cni/bin
# TODO: replace with https://www.talos.dev/v1.9/kubernetes-guides/network/multus/#notes-on-using-cilium-in-combination-with-multus
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-cni-deploy-ds
  namespace: multus-cni
  annotations:

  labels:
    tier: node
    app: kube-cni-deploy-ds
spec:
  selector:
    matchLabels:
      tier: node
      app: kube-cni-deploy-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        tier: node
        app: kube-cni-deploy-ds
    spec:
      nodeSelector:
        beta.kubernetes.io/arch: amd64
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: macvlan
          image: docker.io/library/alpine:3.22.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh"]
          env:
            - name: CNI_VERSION
              value: "1.6.1" # https://github.com/containernetworking/plugins/releases
          args:
            - "-c"
            - "wget https://github.com/containernetworking/plugins/releases/download/v$CNI_VERSION/cni-plugins-linux-amd64-v$CNI_VERSION.tgz; tar xvf /cni-plugins-linux-amd64-v$CNI_VERSION.tgz; cp -f /macvlan /host/opt/cni/bin/; sleep 1000000000000"
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "50Mi"
          securityContext:
            privileged: true
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
        - name: dhcp
          image: docker.io/library/alpine:3.22.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh"]
          env:
            - name: CNI_VERSION
              value: "1.6.1" # https://github.com/containernetworking/plugins/releases
          args:
            - "-c"
            - "wget https://github.com/containernetworking/plugins/releases/download/v$CNI_VERSION/cni-plugins-linux-amd64-v$CNI_VERSION.tgz; tar xvf /cni-plugins-linux-amd64-v$CNI_VERSION.tgz; cp -f /dhcp /host/opt/cni/bin/; sleep 1000000000000"
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "50Mi"
          securityContext:
            privileged: true
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
        - name: route-override
          image: docker.io/library/alpine:3.22.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh"]
          env:
            - name: CNI_VERSION
              value: "0.1" # https://github.com/redhat-nfvpe/cni-route-override/releases
          args:
            - "-c"
            - "wget https://github.com/redhat-nfvpe/cni-route-override/releases/download/v$CNI_VERSION/cni-route-override_${CNI_VERSION}_linux_amd64.tar.gz; tar xvf cni-route-override_${CNI_VERSION}_linux_amd64.tar.gz; cp -f /cni-route-override_${CNI_VERSION}_linux_amd64/cni-route-override /host/opt/cni/bin/route-override; sleep 1000000000000"
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "50Mi"
          securityContext:
            privileged: true
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
      volumes:
        - name: cnibin
          hostPath:
            path: /opt/cni/bin