apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: prod-net
spec:
  config: '{
              "cniVersion": "0.3.1",
              "name" : "dhcp",
              "plugins": [
                  {
                    "type": "macvlan",
                    "master": "enp5s0f0np0.97",
                    "ipam": {
                      "type": "dhcp"
                    }
                  },
                  {
                    "type" : "route-override",
                    "flushroutes" : true,
                    "flushgateway" : true,
                    "addroutes": [
                    {
                        "dst": "10.10.97.0/24",
                        "gw": "10.10.97.1"
                    }
                    ]
                  }
                ]
            }'

---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: mgmt-net
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp54f3a12.98",
      "mode": "bridge",
      "ipam": {
        "type": "dhcp"
      },
      "gateway": "10.10.98.1"
    }'
