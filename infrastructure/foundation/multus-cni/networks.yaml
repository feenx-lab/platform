apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: prod-vlan # https://www.cni.dev/plugins/current/main/vlan/
  namespace: multus-cni
spec:
  config: '{
              "cniVersion": "0.3.1",
              "name": "prod-vlan",
              "plugins": [
                  {
                    "type": "macvlan",
                    "master": "enp5s0f0np0",
                    "ipam": {
                      "type": "dhcp"
                    }
                  },
                  {
                    "type" : "route-override",
                    "flushroutes" : true,
                    "flushgateway" : true,
                    "addroutes": [
                    {
                        "dst": "10.10.97.0/24",
                        "gw": "10.10.97.1"
                    }
                    ]
                  }
                ]
            }'
