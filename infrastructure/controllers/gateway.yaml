apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway
  namespace: gateway
  # annotations:
  #   cert-manager.io/issuer: cloudflare-issuer
spec:
  gatewayClassName: cilium
  addresses:
  - type: IPAddress
    value: 10.10.97.100
  listeners:
    - protocol: HTTP
      port: 80
      name: http-gateway
      hostname: "*.feenx.io"
      allowedRoutes:
        namespaces:
          from: All
    - protocol: HTTP
      port: 80
      name: http-root-gateway
      hostname: "feenx.io"
      allowedRoutes:
        namespaces:
          from: All
